<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job & Life Guides · jen.alsojill</title>
<meta name="description" content="給打工度假背包客與新移民的求職與生活資訊 — FIFO 攻略、ING 開戶禮金教學、履歷健檢站。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #FFFFFF;
    --card: #F3F5FA;
    --line: #DDE3E9;
    --ink: #111111;
    --ink-soft: #6B6B6B;
    --clay: #304873;
    --clay-soft: #22345a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sand);
    color: var(--ink);
    font-family: 'Noto Sans TC', 'DM Sans', sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  .back {
    display: inline-block;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.92rem;
    margin-bottom: 32px;
  }

  .back:hover { color: var(--ink); }

  h1 {
    font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
    font-weight: 500;
    font-size: 1.9rem;
    line-height: 1.35;
    margin: 0 0 6px;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 1rem;
    margin: 0 0 40px;
  }

  .guides {
    margin-top: 8px;
  }

  .guide {
    display: block;
    padding: 28px 0;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }

  .guide:last-child {
    border-bottom: 1px solid var(--line);
  }

  .guide h2 {
    font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
    font-weight: 500;
    font-size: 1.35rem;
    color: var(--clay);
    margin: 0 0 4px;
  }

  .guide .zh-subtitle {
    font-size: 0.92rem;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  .guide p.desc {
    color: var(--ink-soft);
    margin: 0;
    max-width: 48ch;
  }

  .guide .arrow {
    color: var(--clay);
    font-weight: 500;
  }

  .lock-tag {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--clay);
    background: var(--card);
    border: 1px solid var(--line);
    padding: 2px 9px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: middle;
  }

  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  footer a { color: var(--ink-soft); }

  @media (max-width: 480px) {
    .wrap { padding: 40px 20px 56px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← 回首頁</a>

    <h1>Job &amp; Life Guides</h1>
    <p class="subtitle">澳洲求職/生活指南站 — 整理給打工度假背包客與新移民的實用資訊</p>

    <div class="guides">
      <a class="guide" href="/fifo-guide-en/">
        <h2>FIFO Job Guide</h2>
        <p class="zh-subtitle">FIFO 求職一站式頁面</p>
        <p class="desc">申請步驟、必備證照、職位薪資、常見問答，一次看懂怎麼進入礦區工作。<span class="arrow"> →</span></p>
      </a>

      <a class="guide" href="/guides/ing-signup/">
        <h2>ING Sign-up Bonus</h2>
        <p class="zh-subtitle">ING 開戶禮金教學</p>
        <p class="desc">手把手教你怎麼開戶、拿到推薦禮金。<span class="arrow"> →</span></p>
      </a>

      <a class="guide" href="/guides/resume-check/">
        <h2>Resume Health Check</h2>
        <p class="zh-subtitle">澳洲履歷自助健檢站</p>
        <p class="desc">從聯絡資訊到推薦人，一步步檢查你的履歷有沒有符合澳洲規格，最後還有投遞前的確認清單。<span class="arrow"> →</span></p>
      </a>
    </div>

    <footer>
      <p>© 2026 jen.alsojill · <a href="mailto:hi@jenalsojill.com">hi@jenalsojill.com</a></p>
    </footer>
  </div>
</body>
</html>
